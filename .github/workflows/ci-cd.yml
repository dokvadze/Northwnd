name: .NET CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test

    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore Northwnd.sln
      
    - name: Build solution
      run: dotnet build Northwnd.sln --configuration Release --no-restore

    - name: Run unit tests - Products
      run: dotnet test Northwnd.UnitTest/Northwnd.UnitTest.csproj -k "ProductsTests" --configuration Release --no-build --verbosity normal

    - name: Run unit tests - Categories
      run: dotnet test Northwnd.UnitTest/Northwnd.UnitTest.csproj -k "CategoriesTests" --configuration Release --no-build --verbosity normal

    - name: Run unit tests - Regions
      run: dotnet test Northwnd.UnitTest/Northwnd.UnitTest.csproj -k "RegionsTests" --configuration Release --no-build --verbosity normal

    - name: Run all tests with coverage
      run: dotnet test Northwnd.UnitTest/Northwnd.UnitTest.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: always()
      with:
        files: '**/coverage.cobertura.xml'
        flags: unittests
        name: codecov-umbrella

  build-api:
    runs-on: ubuntu-latest
    name: Build API Project
    
    strategy:
      matrix:
        dotnet-version: ['10.0.x']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore API project
      run: dotnet restore Test.API/Northwnd.API.csproj

    - name: Build API project
      run: dotnet build Test.API/Northwnd.API.csproj --configuration Release --no-restore

  build-ui:
    runs-on: ubuntu-latest
    name: Build UI Project
    
    strategy:
      matrix:
        dotnet-version: ['10.0.x']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore UI project
      run: dotnet restore Test.Web/Northwnd.UI.csproj

    - name: Build UI project
      run: dotnet build Test.Web/Northwnd.UI.csproj --configuration Release --no-restore
